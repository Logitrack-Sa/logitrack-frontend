name: CI logitrack-frontend (Next.js y TypeScript)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript y Build de Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js 22 y caché npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificación estricta de tipos (TypeScript)
        run: npm run typecheck

      - name: Compilación de producción (Next.js Build)
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
        run: npm run build
